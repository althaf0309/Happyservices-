# Backend stack: Postgres 16 + Redis + API + Celery worker.
# The frontend runs separately (npm run dev, or Vercel in production).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: happy
      POSTGRES_USER: happy
      POSTGRES_PASSWORD: happy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happy"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    env_file: ./backend/.env
    environment: &api-env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://happy:happy@db:5432/happy
      REDIS_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: "false" # TLS terminates at the reverse proxy
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *api-env
    command: celery -A config worker --loglevel=info
    depends_on: [api, redis]

volumes:
  pgdata:
  media:
